[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homeassistant-stubs"
version = "2026.10.0"
description = "Deprecated: Home Assistant Core ships its own type information"
authors = [{name = "Ruslan Sayfutdinov", email = "ruslan@sayfutdinov.com"}]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Home Automation",
    "Topic :: Software Development",
]
keywords = ["homeassistant", "typing", "pep484"]
requires-python = ">=3.12"
dependencies = [
    "homeassistant>=2024.5.0",
]

[project.urls]
"Homepage" = "https://github.com/KapJI/homeassistant-stubs"
"Bug Tracker" = "https://github.com/KapJI/homeassistant-stubs/issues"
"Release Notes" = "https://github.com/KapJI/homeassistant-stubs/releases"

[tool.hatch.build.targets.wheel]
# The final release ships no stubs, it only keeps existing installs resolvable.
bypass-selection = true
